<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ki da Destruição Artificial</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        background-color: #000;
        background-image: url('https://static0.srcdn.com/wordpress/wp-content/uploads/2020/03/Dragon-Ball-Super-God-of-Destruction-custom.jpg?w=1200&h=675&fit=crop');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }
      article {
        background-color: rgba(0, 0, 0, 0.75);
        padding: 40px;
        border-radius: 12px;
        max-width: 800px;
        margin: 20px;
        color: #ffffff;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      h1 {
        color: purple;
        font-weight: bold;
        font-size: 48px;
        margin-top: 0;
        margin-bottom: 24px;
      }
      p {
        font-size: 22px;
        line-height: 1.6;
        margin-bottom: 20px;
      }
      p:last-child {
        margin-bottom: 0;
      }
      strong {
        font-weight: bold;
      }
      .azul {
        color: blue;
      }
    </style>
  </head>
  <body>
    <article>
      <h1><strong>Ki da Destruição Artificial</strong></h1>
      <p>
        <strong>
          O Ki da Destruição Artificial é um artefato gerado por meio de rondas através da energia formada pelos Sistemas Gravitacionais.
        </strong>
      </p>
      <p>
        <strong>
          Para saber mais, consulte o <span class="azul">Painel</span>.
        </strong>
      </p>
    </article>
  </body>
</html>
